<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PawlaPalabra</title>
<meta name="description" content="PawlaPalabra — a small language-learning app. Tiny words. Big adventures.">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#F28950">
<link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg:#fffaf6; --text:#23201e; --muted:#6b625c; --accent:#d9662a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17140f; --text:#f2ece7; --muted:#a89e97; --accent:#f28950; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 30rem; padding: 2.5rem 1.5rem; text-align: center; }
  h1 { font-size: 2.1rem; margin: 0 0 .5rem; letter-spacing: -.02em; }
  p { color: var(--muted); margin: .6rem 0 0; }
  a { color: var(--accent); }
  .links { margin-top: 2rem; font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>PawlaPalabra</h1>
  <p>Tiny words. Big adventures.<br>A small language-learning app for iPhone.</p>
  <p class="links"><a href="/privacy">Privacy Policy</a></p>
</main>
</body>
</html>
